<!DOCTYPE html>
<html>
  <head>
    <title>Multiplayer Demo - Skin Shop & NPC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" type="text/css">
    <style>
      /* Mobile joystick styles */
      .joystick-container {
        position: fixed;
        bottom: 30px;
        left: 30px;
        width: 120px;
        height: 120px;
        border-radius: 60px;
        background: rgba(0,0,0,0.5);
        touch-action: none;
        display: none;
      }
      .joystick-base {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 60px;
        background: rgba(255,255,255,0.2);
      }
      .joystick-thumb {
        position: absolute;
        width: 50px;
        height: 50px;
        border-radius: 25px;
        background: rgba(255,255,255,0.8);
        top: 35px;
        left: 35px;
        transition: transform 0.05s;
      }
      @media (max-width: 768px) {
        .joystick-container { display: block; }
        .game-container canvas { touch-action: none; }
      }
    </style>
  </head>
  <body>

    <div class="game-container">
      <canvas id="gameCanvas"></canvas>
    </div>
    
    <div class="player-info">
      <div>
        <label for="player-name">Your Name</label>
        <input id="player-name" maxlength="10" type="text" />
      </div>
      <div>
        <button id="change-skin">🎨 Change Skin</button>
      </div>
      <div class="coin-display">
        <label>💰 Coins</label>
        <div id="player-coins" class="coin-amount">0</div>
      </div>
    </div>

    <!-- Merchant Modal -->
    <div id="merchant-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>🎨 SKIN SHOP 🎨</h2>
          <span id="close-modal" class="close">&times;</span>
        </div>
        <div class="modal-body">
          <p id="merchant-message" class="merchant-message">Welcome! Buy skins with your coins!</p>
          <div class="skin-shop-grid" id="skin-shop-list"></div>
        </div>
      </div>
    </div>

    <!-- NPC Dialog Modal -->
    <div id="npc-modal" class="modal">
      <div class="modal-content npc-dialog">
        <div class="modal-header">
          <h2 id="npc-name">🌾 Bà Lão Bán Nón</h2>
          <span id="close-npc" class="close">&times;</span>
        </div>
        <div class="modal-body">
          <div class="npc-avatar">
            <img id="npc-avatar-img" src="npc_hat.png" alt="NPC" style="width:80px; height:80px; border-radius:50%">
          </div>
          <div class="npc-text">
            <p id="npc-dialog-text">Chào con! Bà có những chiếc nón lá đẹp lắm...</p>
          </div>
          <div class="npc-buttons">
            <button id="npc-next-btn" class="npc-btn">➡ Tiếp</button>
            <button id="npc-close-btn" class="npc-btn">❌ Đóng</button>
          </div>
          <div id="npc-progress" style="font-size:12px; text-align:center; margin-top:10px;"></div>
        </div>
      </div>
    </div>

    <!-- Interaction button (hiện khi đến gần NPC) -->
    <div id="interact-btn" class="interact-btn" style="display:none;">
      <button id="talk-btn">💬 Trò chuyện</button>
    </div>

    <!-- Mobile joystick -->
    <div id="joystickContainer" class="joystick-container">
      <div class="joystick-base"></div>
      <div id="joystickThumb" class="joystick-thumb"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  </body>

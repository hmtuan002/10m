<html>
  <head>
    <title>Multiplayer Demo - Skin Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" type="text/css">
    <style>
      /* Thêm style cho NPC Dialog */
      .npc-dialog .modal-content {
        max-width: 400px;
        background: linear-gradient(135deg, #2c3e2f, #1a2a1a);
        color: #f5e6d3;
        border: 3px solid #d4a373;
      }
      .npc-avatar {
        text-align: center;
        margin-bottom: 15px;
      }
      .npc-avatar img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 2px solid #d4a373;
      }
      .npc-text {
        background: rgba(0,0,0,0.7);
        padding: 15px;
        border-radius: 15px;
        min-height: 100px;
        font-size: 16px;
        line-height: 1.5;
        margin: 10px 0;
      }
      .npc-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .npc-btn {
        background: #d4a373;
        color: #2c3e2f;
        border: none;
        padding: 8px 20px;
        border-radius: 25px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .npc-btn:hover {
        transform: scale(1.05);
        background: #f4a261;
      }
      #npc-progress {
        font-size: 12px;
        text-align: center;
        margin-top: 10px;
        color: #d4a373;
      }
      
      /* Thêm style cho nút tương tác */
      .interact-btn {
        position: fixed;
        bottom: 30%;
        right: 30px;
        z-index: 1000;
      }
      #talk-btn {
        background: #4caf50;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      
      /* Thêm style cho Joystick (chỉ hiện trên mobile) */
      .joystick-container {
        position: fixed;
        bottom: 30px;
        left: 30px;
        width: 120px;
        height: 120px;
        border-radius: 60px;
        background: rgba(0,0,0,0.5);
        touch-action: none;
        display: none;
        z-index: 200;
      }
      .joystick-base {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 60px;
        background: rgba(255,255,255,0.2);
      }
      .joystick-thumb {
        position: absolute;
        width: 50px;
        height: 50px;
        border-radius: 25px;
        background: rgba(255,255,255,0.8);
        top: 35px;
        left: 35px;
        transition: transform 0.05s;
      }
      @media (max-width: 768px) {
        .joystick-container { display: block; }
      }
    </style>
  </head>
  <body>

    <div class="game-container">
    </div>
    <div class="player-info">
      <div>
        <label for="player-name">Your Name</label>
        <input id="player-name" maxlength="10" type="text" />
      </div>
      <div>
        <button id="change-skin">🎨 Change Skin</button>
      </div>
      <div class="coin-display">
        <label>💰 Coins</label>
        <div id="player-coins" class="coin-amount">0</div>
      </div>
    </div>

    <!-- Merchant Modal (giữ nguyên) -->
    <div id="merchant-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>🎨 SKIN SHOP 🎨</h2>
          <span id="close-modal" class="close">&times;</span>
        </div>
        <div class="modal-body">
          <p id="merchant-message" class="merchant-message">Welcome! Buy skins with your coins!</p>
          <div class="skin-shop-grid" id="skin-shop-list">
            <!-- Skins will be dynamically added here -->
          </div>
        </div>
      </div>
    </div>

    <!-- THÊM MỚI: NPC Dialog Modal -->
    <div id="npc-modal" class="modal">
      <div class="modal-content npc-dialog">
        <div class="modal-header">
          <h2 id="npc-name">🌾 Bà Lão Bán Nón</h2>
          <span id="close-npc" class="close">&times;</span>
        </div>
        <div class="modal-body">
          <div class="npc-avatar">
            <img id="npc-avatar-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23d4a373'/%3E%3Ctext x='50' y='65' font-size='40' text-anchor='middle' fill='%234a2c1a'%3E👒%3C/text%3E%3C/svg%3E" alt="NPC">
          </div>
          <div class="npc-text">
            <p id="npc-dialog-text">Chào con! Bà có những chiếc nón lá đẹp lắm...</p>
          </div>
          <div class="npc-buttons">
            <button id="npc-next-btn" class="npc-btn">➡ Tiếp</button>
            <button id="npc-close-btn" class="npc-btn">❌ Đóng</button>
          </div>
          <div id="npc-progress"></div>
        </div>
      </div>
    </div>

    <!-- THÊM MỚI: Interaction Button (hiện khi đến gần NPC) -->
    <div id="interact-btn" class="interact-btn" style="display:none;">
      <button id="talk-btn">💬 Trò chuyện</button>
    </div>

    <!-- THÊM MỚI: Mobile Joystick -->
    <div id="joystickContainer" class="joystick-container">
      <div class="joystick-base"></div>
      <div id="joystickThumb" class="joystick-thumb"></div>
    </div>

  </body>
</html>

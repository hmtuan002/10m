<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Multiplayer Game - Làng Việt</title>
  <style>
    * {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Source Sans Pro', sans-serif;
      background: #0a2f2a;
      touch-action: none;
    }

    .game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
    }

    /* UI bên phải */
    .player-info {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 32px;
      color: white;
      display: flex;
      gap: 20px;
      z-index: 100;
      font-weight: bold;
      border: 1px solid rgba(255,215,0,0.5);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .player-info input {
      background: #2c2c2c;
      border: 1px solid #ffd966;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      width: 100px;
    }

    .player-info button {
      background: #ffaa33;
      border: none;
      padding: 6px 15px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }

    .player-info button:hover {
      background: #ffcc55;
      transform: scale(1.02);
    }

    .coin-display {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2c2c2c;
      padding: 4px 15px;
      border-radius: 30px;
      border: 1px solid gold;
    }

    .coin-amount {
      color: #ffd966;
      font-size: 1.3rem;
      font-weight: bold;
    }

    /* Modal shop */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #1e2a2e;
      border-radius: 32px;
      width: 90%;
      max-width: 550px;
      max-height: 85vh;
      overflow-y: auto;
      color: white;
      border: 2px solid #ffaa44;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid #ffaa44;
      background: #0f1a1c;
      border-radius: 32px 32px 0 0;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close {
      font-size: 32px;
      cursor: pointer;
      transition: 0.2s;
    }

    .close:hover {
      color: #ffaa44;
    }

    .modal-body {
      padding: 24px;
    }

    .skin-shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }

    .skin-card {
      background: #2e3b3e;
      border-radius: 20px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #5a6e6e;
    }

    .skin-card:hover {
      transform: translateY(-5px);
      background: #3e4e52;
      border-color: #ffaa44;
    }

    .skin-card img {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
    }

    .skin-name {
      font-weight: bold;
      margin: 8px 0;
    }

    .skin-price {
      color: #ffd966;
    }

    .merchant-message {
      background: #0f1a1c;
      padding: 12px;
      border-radius: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* JOYSTICK ẢO (MOBA) */
    .joystick-container {
      position: fixed;
      bottom: 80px;
      left: 80px;
      width: 140px;
      height: 140px;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      z-index: 200;
      touch-action: none;
    }

    .joystick-base {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(30,30,40,0.7);
      border-radius: 50%;
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,0.3);
    }

    .joystick-thumb {
      position: absolute;
      width: 55px;
      height: 55px;
      background: rgba(255,215,0,0.9);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      cursor: grab;
      transition: 0.05s linear;
    }

    /* HỘI THOẠI NPC (kiểu Genshin) */
    .npc-dialog-modal {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 600px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      border: 2px solid #d4af37;
      z-index: 1000;
      padding: 20px;
      color: white;
      font-family: inherit;
      box-shadow: 0 10px 30px black;
    }

    .npc-dialog-header {
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #d4af37;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .npc-avatar {
      width: 60px;
      height: 60px;
      background: #2c5a3e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      border: 2px solid #ffaa44;
    }

    .npc-name {
      font-size: 1.4rem;
      font-weight: bold;
      text-shadow: 1px 1px 0 #5a3e1a;
    }

    .npc-dialog-text {
      font-size: 1.1rem;
      line-height: 1.5;
      margin: 20px 10px;
      min-height: 80px;
    }

    .dialog-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      margin-top: 10px;
    }

    .dialog-btn {
      background: #d4af37;
      border: none;
      padding: 8px 24px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.1s;
    }

    .dialog-btn:hover {
      background: #ffcd55;
      transform: scale(0.98);
    }

    @media (max-width: 768px) {
      .joystick-container { width: 110px; height: 110px; bottom: 60px; left: 60px; }
      .joystick-thumb { width: 45px; height: 45px; }
      .player-info { gap: 8px; padding: 8px 14px; font-size: 0.8rem; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="game-container">
  <canvas id="gameCanvas"></canvas>
</div>

<div class="player-info">
  <div>
    <label for="player-name">Tên bạn</label>
    <input id="player-name" maxlength="10" type="text" />
  </div>
  <div>
    <button id="change-skin">🎨 Đổi Skin</button>
  </div>
  <div class="coin-display">
    <label>💰 Xu</label>
    <div id="player-coins" class="coin-amount">0</div>
  </div>
</div>

<!-- Modal Shop Skin -->
<div id="merchant-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🎨 CỬA HÀNG SKIN 🎨</h2>
      <span id="close-modal" class="close">&times;</span>
    </div>
    <div class="modal-body">
      <p id="merchant-message" class="merchant-message">Chào mừng! Dùng xu để mua skin nhé!</p>
      <div class="skin-shop-grid" id="skin-shop-list"></div>
    </div>
  </div>
</div>

<!-- NPC Dialog Modal (Nón lá Việt Nam) -->
<div id="npc-dialog-modal" class="npc-dialog-modal">
  <div class="npc-dialog-header">
    <div class="npc-avatar">🧕</div>
    <div class="npc-name">Bà Lão Làng</div>
  </div>
  <div id="npc-dialog-text" class="npc-dialog-text">
    <!-- Nội dung hội thoại từng trang -->
  </div>
  <div class="dialog-buttons">
    <button id="dialog-next-btn" class="dialog-btn">Tiếp ➡</button>
    <button id="dialog-close-btn" class="dialog-btn">Đóng</button>
  </div>
</div>

<!-- Joystick ảo di chuyển cho mobile -->
<div id="joystickContainer" class="joystick-container">
  <div class="joystick-base"></div>
  <div id="joystickThumb" class="joystick-thumb"></div>
</div>

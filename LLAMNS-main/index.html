<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Vùng Đất Việt - Nón Lá Việt Nam</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: #0a1f1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Game Container */
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #2b5e3b;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }

        /* UI Panels */
        .player-info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: white;
            display: flex;
            gap: 20px;
            z-index: 100;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .player-info input {
            padding: 5px 10px;
            border-radius: 8px;
            border: none;
            background: #2c2c2c;
            color: white;
            font-weight: bold;
        }

        .coin-display {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .coin-amount {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.2em;
        }

        button {
            background: #ff9800;
            border: none;
            padding: 5px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Modal Chung */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e2a2a;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            animation: modalAppear 0.3s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: #ff9800;
            padding: 15px;
            border-radius: 18px 18px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.3em;
        }

        .close {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .close:hover {
            color: white;
        }

        .modal-body {
            padding: 20px;
            color: white;
        }

        .skin-shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .skin-card {
            background: #2c3e3e;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #ffd700;
        }

        .skin-card:hover {
            transform: translateY(-5px);
            background: #3e5e5e;
        }

        /* UI Mobile Joystick */
        .joystick-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            border-radius: 60px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            touch-action: none;
        }

        .joystick-base {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
        }

        .joystick-thumb {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: rgba(255,255,255,0.8);
            top: 35px;
            left: 35px;
            transition: transform 0.05s linear;
            cursor: pointer;
        }

        /* NPC Chat UI (Genshin Style) */
        .npc-chat-modal {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border-left: 5px solid #ffd700;
            padding: 20px;
            z-index: 1000;
            max-width: 500px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .npc-chat-name {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .npc-chat-text {
            color: white;
            line-height: 1.5;
            margin-bottom: 20px;
            font-size: 1.05em;
        }

        .npc-chat-avatar {
            width: 60px;
            height: 60px;
            background: #ff9800;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            margin-right: 15px;
            float: left;
            shape-outside: circle();
        }

        .npc-chat-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            clear: both;
        }

        .npc-chat-btn {
            background: #ff9800;
            padding: 8px 20px;
            border-radius: 25px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .npc-chat-btn.close {
            background: #555;
        }

        /* Action Button khi đến gần NPC */
        .npc-action-btn {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff9800;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1em;
            z-index: 150;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            cursor: pointer;
            animation: bounce 0.5s infinite alternate;
            display: none;
        }

        @keyframes bounce {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-10px); }
        }

        @media (max-width: 768px) {
            .joystick-container {
                display: block;
            }
            .player-info {
                top: 10px;
                left: 10px;
                padding: 8px 12px;
                font-size: 12px;
                gap: 10px;
            }
            .npc-chat-modal {
                bottom: 10px;
                left: 10px;
                right: 10px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="game-canvas"></canvas>
</div>

<div class="player-info">
    <div>
        <label for="player-name">🎭 Tên của bạn</label>
        <input id="player-name" maxlength="12" type="text" placeholder="Nhập tên"/>
    </div>
    <div>
        <button id="change-skin">👕 Đổi Skin</button>
    </div>
    <div class="coin-display">
        <label>💰 Xu</label>
        <div id="player-coins" class="coin-amount">0</div>
    </div>
</div>

<!-- Modal Skin Shop -->
<div id="merchant-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🎨 CỬA HÀNG SKIN 🎨</h2>
            <span id="close-modal-shop" class="close">&times;</span>
        </div>
        <div class="modal-body">
            <p id="merchant-message" class="merchant-message">Chào mừng! Hãy dùng xu để mua skin nhé!</p>
            <div class="skin-shop-grid" id="skin-shop-list"></div>
        </div>
    </div>
</div>

<!-- NPC Chat UI -->
<div id="npc-chat-modal" class="npc-chat-modal">
    <div style="display: flex; align-items: center; margin-bottom: 15px;">
        <div class="npc-chat-avatar">🎋</div>
        <div class="npc-chat-name" id="npc-chat-name">Người Kể Chuyện</div>
    </div>
    <div class="npc-chat-text" id="npc-chat-text">
        Nội dung hội thoại...
    </div>
    <div class="npc-chat-buttons">
        <button id="npc-chat-next" class="npc-chat-btn">Tiếp theo ▶</button>
        <button id="npc-chat-close" class="npc-chat-btn close">Đóng ✖</button>
    </div>
</div>

<!-- Action Button khi đến gần NPC -->
<button id="npc-action-btn" class="npc-action-btn">💬 Trò chuyện</button>

<!-- Điều khiển joystick mobile -->
<div id="joystick-container" class="joystick-container">
    <div class="joystick-base"></div>
    <div id="joystick-thumb" class="joystick-thumb"></div>
</div>
